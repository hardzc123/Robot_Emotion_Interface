<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Desk-Emoji Robot - Authentic Robot Faces</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest-robot.json">

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Robot Face">
    <link rel="apple-touch-icon" href="apple-touch-icon-robot.png">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#1a1a2e">
    <meta name="msapplication-TileColor" content="#1a1a2e">

    <link rel="stylesheet" href="style-robot.css">
</head>
<body>
    <div class="container">
        <h1>🤖 Desk-Emoji Robot</h1>
        <p class="subtitle">Authentic Robot Emotion Faces</p>
        <p class="version-badge">Robot Face Version - Programmatically Drawn</p>

        <!-- Robot Display -->
        <div class="robot-container">
            <div class="robot-body" id="robotBody">
                <div class="emoji-display" id="emojiDisplay">
                    <!-- Canvas for drawing robot face -->
                    <canvas id="robotCanvas" width="400" height="400"></canvas>
                </div>
            </div>
        </div>

        <!-- Emotion Controls -->
        <div class="controls">
            <h2>Select Robot Emotion</h2>
            <div class="emotion-grid">
                <button class="emotion-btn active" data-emotion="happy">😊 Happy</button>
                <button class="emotion-btn" data-emotion="sad">😢 Sad</button>
                <button class="emotion-btn" data-emotion="angry">😠 Angry</button>
                <button class="emotion-btn" data-emotion="surprised">😲 Surprised</button>
                <button class="emotion-btn" data-emotion="sleepy">😴 Sleepy</button>
                <button class="emotion-btn" data-emotion="wakeup">👀 Waking Up</button>
                <button class="emotion-btn" data-emotion="blink">😑 Blinking</button>
                <button class="emotion-btn" data-emotion="lookLeft">👈 Look Left</button>
                <button class="emotion-btn" data-emotion="lookRight">👉 Look Right</button>
                <button class="emotion-btn" data-emotion="center">😐 Center</button>
            </div>
        </div>

        <!-- Movement Controls -->
        <div class="movement-controls">
            <h2>Gimbal Control</h2>
            <div class="joystick-container">
                <div class="joystick-label">Tilt Robot Head</div>
                <div class="joystick">
                    <button class="move-btn" data-direction="up">↑</button>
                    <div class="joystick-row">
                        <button class="move-btn" data-direction="left">←</button>
                        <button class="move-btn center" data-direction="center">⊙</button>
                        <button class="move-btn" data-direction="right">→</button>
                    </div>
                    <button class="move-btn" data-direction="down">↓</button>
                </div>
            </div>
        </div>

        <!-- Animation Mode -->
        <div class="animation-controls">
            <h2>Animation Mode</h2>
            <button class="action-btn" id="idleMode">🌀 Idle Blinking</button>
            <button class="action-btn" id="randomMode">🎲 Random Emotions</button>
            <button class="action-btn" id="expressiveMode">✨ Expressive Mode</button>
        </div>

        <!-- Version Switcher -->
        <div class="version-switcher">
            <a href="index.html" class="switch-btn">Switch to Emoji Version 😊</a>
        </div>
    </div>

    <script src="app-robot.js"></script>
</body>
</html>
