<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desk-Emoji Robot - Vivid Emotions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🤖 Desk-Emoji Robot</h1>
        <p class="subtitle">Vivid Robot Emotions Interface</p>

        <!-- Robot Display -->
        <div class="robot-container">
            <div class="robot-body" id="robotBody">
                <div class="emoji-display" id="emojiDisplay">
                    <div class="face-container" id="faceContainer">
                        <!-- Dynamic emoji face will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Emotion Controls -->
        <div class="controls">
            <h2>Select Emotion</h2>
            <div class="emotion-grid">
                <button class="emotion-btn" data-emotion="happy">😊 Happy</button>
                <button class="emotion-btn" data-emotion="excited">🤩 Excited</button>
                <button class="emotion-btn" data-emotion="love">😍 Love</button>
                <button class="emotion-btn" data-emotion="cool">😎 Cool</button>
                <button class="emotion-btn" data-emotion="thinking">🤔 Thinking</button>
                <button class="emotion-btn" data-emotion="confused">😕 Confused</button>
                <button class="emotion-btn" data-emotion="sad">😢 Sad</button>
                <button class="emotion-btn" data-emotion="angry">😠 Angry</button>
                <button class="emotion-btn" data-emotion="sleepy">😴 Sleepy</button>
                <button class="emotion-btn" data-emotion="surprised">😲 Surprised</button>
                <button class="emotion-btn" data-emotion="laugh">😂 Laughing</button>
                <button class="emotion-btn" data-emotion="wink">😉 Wink</button>
            </div>
        </div>

        <!-- Movement Controls -->
        <div class="movement-controls">
            <h2>Gimbal Control</h2>
            <div class="joystick-container">
                <div class="joystick-label">Tilt</div>
                <div class="joystick">
                    <button class="move-btn" data-direction="up">↑</button>
                    <div class="joystick-row">
                        <button class="move-btn" data-direction="left">←</button>
                        <button class="move-btn center" data-direction="center">⊙</button>
                        <button class="move-btn" data-direction="right">→</button>
                    </div>
                    <button class="move-btn" data-direction="down">↓</button>
                </div>
            </div>
        </div>

        <!-- Animation Mode -->
        <div class="animation-controls">
            <h2>Animation Mode</h2>
            <button class="action-btn" id="idleMode">🌀 Idle Animation</button>
            <button class="action-btn" id="randomMode">🎲 Random Emotions</button>
            <button class="action-btn" id="expressiveMode">✨ Expressive Mode</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
